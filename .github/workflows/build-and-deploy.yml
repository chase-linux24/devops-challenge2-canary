
name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: tc2-canary-foodtruck
  ROLE_ARN: arn:aws:iam::381491979307:role/tc2-canary-github-actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$TAG ./app
          docker push $REGISTRY/$ECR_REPOSITORY:$TAG

      - name: Update rollout manifest (GitOps commit)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          sed -i "s|image: .*tc2-canary-foodtruck:.*|image: $REGISTRY/$ECR_REPOSITORY:$TAG|" k8s/rollout.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/rollout.yaml
          git commit -m "Deploy image $TAG [skip ci]"
          git pull --rebase origin main
          git push