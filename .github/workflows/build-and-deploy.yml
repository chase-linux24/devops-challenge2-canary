
name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: tc2-canary-foodtruck

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug OIDC claims
        run: |
          RESP=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          TOKEN=$(echo "$RESP" | jq -r '.value')
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub, aud, repository}'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::381491979307:role/tc2-canary-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$TAG ./app
          docker push $REGISTRY/$ECR_REPOSITORY:$TAG

      - name: Update deployment manifest (GitOps commit)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          sed -i "s|image: .*tc2-canary-foodtruck:.*|image: $REGISTRY/$ECR_REPOSITORY:$TAG|" k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Deploy image $TAG [skip ci]"
          git push