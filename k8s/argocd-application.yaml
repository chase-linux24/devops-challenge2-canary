apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: foodtruck
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/chase-linux24/devops-challenge2-canary.git
    targetRevision: main
    path: k8s
    directory:
      exclude: "argocd-application.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
