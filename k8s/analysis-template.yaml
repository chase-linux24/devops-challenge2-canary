apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
spec:
  metrics:
    - name: http-success-rate
      count: 3
      interval: 20s
      failureLimit: 1
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: probe
                    image: curlimages/curl:8.10.1
                    command: ["sh", "-c"]
                    args:
                      - |
                        FAIL=0
                        for i in $(seq 1 20); do
                          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://foodtruck.default.svc.cluster.local/)
                          if [ "$CODE" != "200" ]; then FAIL=$((FAIL+1)); fi
                        done
                        echo "failed requests: $FAIL of 20"
                        [ "$FAIL" -le 1 ]
